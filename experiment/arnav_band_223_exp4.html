<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Palindrome Checker</title>
    <style>
        :root {
            --primary: #6366F1;
            --primary-hover: #4F46E5;
            --secondary: #EC4899;
            --bg-gradient: linear-gradient(135deg, #e0e7ff 0%, #fce7f3 100%);
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-main: #1F2937;
            --text-muted: #6B7280;
        }

        body { 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 40px 30px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 450px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-2px);
        }

        h2 { 
            margin-top: 0; 
            margin-bottom: 8px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 28px;
            font-weight: 800;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] { 
            flex: 1;
            padding: 14px 16px; 
            font-size: 16px; 
            border: 2px solid #E5E7EB;
            border-radius: 12px;
            transition: all 0.3s ease;
            outline: none;
            background: rgba(255, 255, 255, 0.9);
        }

        input[type="text"]:focus { 
            border-color: var(--primary); 
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }

        button { 
            flex: 1;
            padding: 14px 24px; 
            font-size: 16px; 
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        #checkBtn {
            background-color: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        #checkBtn:hover { 
            background-color: var(--primary-hover); 
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4);
        }

        #clearBtn {
            background-color: #F3F4F6;
            color: var(--text-main);
            flex: 0.4;
        }

        #clearBtn:hover {
            background-color: #E5E7EB;
        }

        button:active { 
            transform: scale(0.96) !important; 
        }

        /* Styling for the new Options Section */
        .options-panel {
            display: flex;
            justify-content: space-between;
            background: rgba(255,255,255,0.6);
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 24px;
            font-size: 14px;
            color: var(--text-main);
            border: 1px solid #E5E7EB;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }

        .checkbox-label input[type="checkbox"] {
            accent-color: var(--primary);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        /* Animated Result Box */
        .message { 
            font-weight: 500; 
            padding: 16px; 
            border-radius: 12px; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 15px;
            line-height: 1.5;
            opacity: 0;
            transform: scale(0.95);
        }

        .message.show {
            opacity: 1;
            transform: scale(1);
        }

        .error { 
            background: #FEF2F2; 
            color: #991B1B; 
            border: 1px solid #F87171;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.1);
        }
        .success { 
            background: #F0FDF4; 
            color: #166534; 
            border: 1px solid #4ADE80;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.1);
        }
        .neutral { 
            background: #F8FAFC; 
            color: #475569; 
            border: 1px dashed #CBD5E1; 
            opacity: 1;
            transform: scale(1);
        }

        .stats { 
            margin-top: 24px; 
            font-size: 13px; 
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Palindrome Pro</h2>
        <div class="subtitle">Check words, phrases, or numbers</div>
        
        <div class="options-panel">
            <label class="checkbox-label">
                <input type="checkbox" id="optCaseSensitive"> Case Sensitive
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="optKeepPunct"> Keep Punctuation
            </label>
        </div>

        <div class="input-group">
            <input type="text" id="wordInput" placeholder="Enter text here..." autocomplete="off">
        </div>

        <div class="btn-group">
            <button id="checkBtn">Analyze Text</button>
            <button id="clearBtn">Clear</button>
        </div>
        
        <div id="result" class="message neutral">Awaiting input...</div>
        <div id="stats" class="stats">Total checks: 0</div>
    </div>

    <script>
        const inputEl = document.getElementById('wordInput');
        const resultEl = document.getElementById('result');
        const statsEl = document.getElementById('stats');
        
        // New option elements
        const optCaseSensitive = document.getElementById('optCaseSensitive');
        const optKeepPunct = document.getElementById('optKeepPunct');

        const createAnalyzer = function() {
            let checksPerformed = 0; 

            // Updated cleanText to accept user options
            const cleanText = (str, isCaseSensitive, keepPunctuation) => {
                let processed = str;
                
                if (!keepPunctuation) {
                    // Remove anything that isn't a letter or number
                    processed = processed.replace(/[^A-Za-z0-9]/g, '');
                }
                
                if (!isCaseSensitive) {
                    processed = processed.toLowerCase();
                }
                
                return processed;
            };

            return {
                check: function(text, options) {
                    checksPerformed++; 
                    updateStats(checksPerformed); 

                    try {
                        if (!text || text.trim() === '') {
                            throw new Error("Whoops! The input cannot be blank.");
                        }
                        if (text.length < 2) {
                            throw new Error("Please enter at least 2 characters.");
                        }

                        const cleaned = cleanText(text, options.isCaseSensitive, options.keepPunctuation);
                        const reversed = cleaned.split('').reverse().join('');

                        if (cleaned === reversed) {
                            return { 
                                isPalindrome: true, 
                                msg: `🎉 <strong>Yes!</strong><br>"${text}" is a palindrome.` 
                            };
                        } else {
                            return { 
                                isPalindrome: false, 
                                msg: `❌ <strong>No.</strong><br>"${text}" is not a palindrome.` 
                            };
                        }

                    } catch (error) {
                        return { isError: true, msg: error.message };
                    }
                }
            };
        };

        const analyzer = createAnalyzer();

        function updateStats(count) {
            statsEl.textContent = `Total checks: ${count}`;
        }

        // Animation helper
        function displayResult(result) {
            // Briefly remove the 'show' class to reset the animation
            resultEl.classList.remove('show');
            
            setTimeout(() => {
                resultEl.innerHTML = result.msg;
                if (result.isError) {
                    resultEl.className = 'message error show';
                } else if (result.isPalindrome) {
                    resultEl.className = 'message success show';
                } else {
                    resultEl.className = 'message error show'; // Use error style for non-palindromes to make it pop
                }
            }, 50); // Tiny delay to allow DOM to register the class removal
        }

        // Event Listeners
        inputEl.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('checkBtn').click();
            }
        });

        document.getElementById('checkBtn').addEventListener('click', () => {
            const userInput = inputEl.value;
            
            // Gather current options from checkboxes
            const currentOptions = {
                isCaseSensitive: optCaseSensitive.checked,
                keepPunctuation: optKeepPunct.checked
            };

            const result = analyzer.check(userInput, currentOptions);
            displayResult(result);
        });

        // Clear functionality
        document.getElementById('clearBtn').addEventListener('click', () => {
            inputEl.value = '';
            inputEl.focus();
            resultEl.className = 'message neutral';
            resultEl.textContent = 'Awaiting input...';
        });
    </script>
</body>
</html>
