<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enhanced Task Manager</title>
  <style>
    :root {
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --bg: #f0f4f8;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --edit: #f59e0b;
      --edit-hover: #d97706;
      --delete: #ef4444;
      --delete-hover: #dc2626;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 40px 16px;
      min-height: 100vh;
    }

    .container {
      background: var(--card-bg);
      width: 100%;
      max-width: 580px;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
      height: fit-content;
    }

    h1 {
      text-align: center;
      color: var(--primary);
      font-size: 1.75rem;
      margin-bottom: 20px;
    }

    /* Input Controls */
    .input-section {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .input-section input[type="text"] {
      flex: 1;
      min-width: 200px;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }

    .input-section input[type="text"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }

    .input-section select {
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      font-size: 0.9rem;
      color: var(--text);
      outline: none;
      cursor: pointer;
    }

    .input-section button {
      padding: 10px 18px;
      background-color: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .input-section button:hover {
      background-color: var(--primary-hover);
    }

    /* Filters & Summary */
    .filter-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 16px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .filter-buttons {
      display: flex;
      gap: 6px;
    }

    .filter-btn {
      background: none;
      border: 1px solid transparent;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .filter-btn.active {
      background-color: #e0f2fe;
      color: var(--primary);
      font-weight: 600;
    }

    /* Task List */
    #taskList {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background-color: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      transition: transform 0.15s, opacity 0.2s;
    }

    .task-item.completed {
      opacity: 0.65;
    }

    .task-item.completed .task-text {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .task-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .task-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .task-text {
      font-size: 0.95rem;
      word-break: break-word;
    }

    .priority-badge {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 4px;
      width: fit-content;
    }

    .priority-High { background: #fee2e2; color: #b91c1c; }
    .priority-Medium { background: #fef3c7; color: #b45309; }
    .priority-Low { background: #dcfce7; color: #15803d; }

    /* Action Buttons */
    .actions {
      display: flex;
      gap: 6px;
    }

    .btn-edit, .btn-delete, .btn-save {
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      color: white;
    }

    .btn-edit { background-color: var(--edit); }
    .btn-edit:hover { background-color: var(--edit-hover); }

    .btn-delete { background-color: var(--delete); }
    .btn-delete:hover { background-color: var(--delete-hover); }

    .btn-save { background-color: var(--success); }

    .inline-edit-input {
      width: 100%;
      padding: 6px 8px;
      font-size: 0.95rem;
      border: 1px solid var(--primary);
      border-radius: 4px;
      outline: none;
    }

    .empty-state {
      text-align: center;
      padding: 20px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>To-Do List</h1>

    <div class="input-section">
      <input type="text" id="taskInput" placeholder="Enter a task..." />
      <select id="priorityInput">
        <option value="Low">Low</option>
        <option value="Medium" selected>Medium</option>
        <option value="High">High</option>
      </select>
      <button id="addBtn">Add</button>
    </div>

    <div class="filter-bar">
      <div class="filter-buttons">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
      </div>
      <span id="taskStats">0 / 0 Done</span>
    </div>

    <ul id="taskList"></ul>
  </div>

  <script>
    // State management with LocalStorage
    let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
    let currentFilter = 'all';

    // DOM References
    const taskInput = document.getElementById('taskInput');
    const priorityInput = document.getElementById('priorityInput');
    const addBtn = document.getElementById('addBtn');
    const taskList = document.getElementById('taskList');
    const taskStats = document.getElementById('taskStats');
    const filterButtons = document.querySelectorAll('.filter-btn');

    // Save & Re-render
    function updateState() {
      localStorage.setItem('tasks', JSON.stringify(tasks));
      renderTasks();
    }

    // Render list based on currentFilter
    function renderTasks() {
      taskList.innerHTML = '';

      const filteredTasks = tasks.filter(task => {
        if (currentFilter === 'active') return !task.completed;
        if (currentFilter === 'completed') return task.completed;
        return true;
      });

      if (filteredTasks.length === 0) {
        taskList.innerHTML = `<li class="empty-state">No tasks to display</li>`;
      } else {
        filteredTasks.forEach(task => {
          const li = document.createElement('li');
          li.className = `task-item ${task.completed ? 'completed' : ''}`;
          li.dataset.id = task.id;

          li.innerHTML = `
            <input type="checkbox" class="task-checkbox" ${task.completed ? 'checked' : ''}>
            <div class="task-content">
              <span class="priority-badge priority-${task.priority}">${task.priority}</span>
              <span class="task-text">${task.text}</span>
            </div>
            <div class="actions">
              <button class="btn-edit">Edit</button>
              <button class="btn-delete">Delete</button>
            </div>
          `;
          taskList.appendChild(li);
        });
      }

      // Update counters
      const total = tasks.length;
      const completed = tasks.filter(t => t.completed).length;
      taskStats.textContent = `${completed} / ${total} Done`;
    }

    // Add Task
    function addTask() {
      const text = taskInput.value.trim();
      if (!text) return;

      tasks.push({
        id: Date.now().toString(),
        text: text,
        priority: priorityInput.value,
        completed: false
      });

      taskInput.value = '';
      updateState();
    }

    // Centralized Event Delegation for taskList
    taskList.addEventListener('click', (e) => {
      const target = e.target;
      const taskItem = target.closest('.task-item');
      if (!taskItem) return;

      const taskId = taskItem.dataset.id;
      const taskIndex = tasks.findIndex(t => t.id === taskId);

      // Checkbox Toggle
      if (target.classList.contains('task-checkbox')) {
        tasks[taskIndex].completed = target.checked;
        updateState();
      }

      // Delete Action
      if (target.classList.contains('btn-delete')) {
        tasks.splice(taskIndex, 1);
        updateState();
      }

      // Edit / Save Action
      if (target.classList.contains('btn-edit')) {
        const textSpan = taskItem.querySelector('.task-text');
        const isEditing = target.textContent === 'Save';

        if (!isEditing) {
          // Switch to Edit Mode
          const currentText = tasks[taskIndex].text;
          const input = document.createElement('input');
          input.type = 'text';
          input.value = currentText;
          input.className = 'inline-edit-input';

          textSpan.replaceWith(input);
          input.focus();
          target.textContent = 'Save';
          target.className = 'btn-save';
        } else {
          // Save Edit
          const editInput = taskItem.querySelector('.inline-edit-input');
          const updatedText = editInput.value.trim();

          if (updatedText) {
            tasks[taskIndex].text = updatedText;
          }
          updateState();
        }
      }
    });

    // Filter Buttons Event
    filterButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        filterButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderTasks();
      });
    });

    // Enter Key Support
    taskInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addTask();
    });

    addBtn.addEventListener('click', addTask);

    // Initial render
    renderTasks();
  </script>
</body>
</html>
